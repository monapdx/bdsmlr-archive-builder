[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bdsmlr-archive"
version = "0.1.0"
description = "Generate a static offline archive from BDSMLR-style JSON exports (with optional media mirroring)."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name="Your Name"}]
dependencies = ["requests>=2.31"]

[project.scripts]
bdsmlr-archive = "bdsmlr_archive.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]